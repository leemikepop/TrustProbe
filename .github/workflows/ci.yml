name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.14904198"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :testbed:assembleDebug lint
